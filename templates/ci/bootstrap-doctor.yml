# .github/workflows/bootstrap-doctor.yml にコピーする。
# project-bootstrap の採用状態を「誰がどう変更しても通る場所」で検証する net。
#
# なぜ必要か: SessionStart の採用 audit (hooks/bootstrap-session-doctor.sh) は **plugin が在る
# Claude session でしか発火しない**。plugin を入れず .claude/hooks/ に subset だけ vendoring した
# repo (= 実際の事故: docs/incidents/2026-06-02-coverage-drift-silent) は、その session audit が
# そもそも走らない。CI なら plugin 非依存で必ず通るので、採用したのに gate が物理的に欠けている
# partial 状態 (doctor STATUS=partial → exit 2) を bypass 不可で fail にできる。
#
# 前提 (consumer repo への vendor):
#   - scripts/doctor.sh  (本リポ scripts/doctor.sh をコピー)
name: bootstrap-doctor
on:
  pull_request:
  push:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: project-bootstrap adoption audit
        run: |
          set -uo pipefail
          # Actions の run: は bash -e で走るため、素の `cmd; status=$?` は非 0 で捕捉前に死ぬ。
          # `|| status=$?` で -e を無効化して exit code を値として受ける。
          status=0
          bash scripts/doctor.sh . || status=$?
          # ok/unadopted/declined/skip = 0、partial = 2 (fail)。想定外 exit も素通しにしない。
          if [ "$status" -eq 2 ]; then
            echo "::error::project-bootstrap adoption is partial — 採用したのに gate が物理的に欠けている。上の doctor 出力の欠落を埋めること。"
            exit 1
          fi
          exit "$status"
