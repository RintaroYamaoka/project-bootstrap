# Secret-scan gate (ADR 0016 — Class A static detection) — TEMPLATE, opt-in.
#
# WHY: ADR 0016 splits AI hardcoding into two classes. Class A is the "capability
# limit" half that a static tool CAN catch — and hardcoded secrets/credentials are its
# most detectable member: empirical repo studies find AI-generated code embeds API keys
# / tokens at roughly TWICE the human rate (arXiv 2603.27130). This workflow is the CI
# half of that permanent Class A layer (the local half is the opt-in `.bootstrap/lint`
# gate). Per ADR 0016 it deliberately does NOT hand-roll a matcher: a bespoke secret
# regex re-imports the "unreviewed matcher shipped into the consumer repo" failure class
# (the same one merge-targets.sh / protected-branch.sh had to kill) and carries a
# false-positive fail-mode where noise hides real data. It delegates to gitleaks — an
# existing, well-known scanner — instead of reinventing detection.
#
# SCOPE — be honest about what this is and isn't:
#   - Catches: secrets / credentials / API keys / tokens hardcoded into tracked source
#     (Class A, static half).
#   - Does NOT catch: the rest of Class A (prompt-biased constants, stub / "wrong logic"
#     hardcoded return values) or ANY of Class B (reward-hacking / test-gaming). Those
#     need behavioural verification, not a scanner — see the verification skill's 7th
#     seam (held-out oracle / metamorphic), not this file.
#   - Opt-in: adopting this workflow is a choice; it enforces no bootstrap contract, so
#     unlike the templates/ci/bootstrap-*.yml gates it vendors nothing from the plugin.
#
# SETUP:
#   1. Copy this file to .github/workflows/secret-scan.yml in your repo.
#   2. No secret needed for personal / public repos: gitleaks-action uses the
#      auto-provided GITHUB_TOKEN. GITLEAKS_LICENSE is required ONLY for repos owned by
#      a GitHub *organization* — if so, set it as a repo/org secret (free license at
#      gitleaks.io) and uncomment the env line below. Leave it commented otherwise.
#   3. (Optional) Register "gitleaks" as a REQUIRED status check on your protected branch
#      to make a found secret un-mergeable (bypass-proof); otherwise the red X is advisory
#      and humans respect it. Failing the check when a secret is found is the point.
name: secret-scan
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history so gitleaks can scan the whole commit range)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # ONLY for GitHub org-owned repos
